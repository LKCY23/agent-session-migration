name: Check Upstream Tool Updates

on:
  schedule:
    # Weekly on Mondays at 02:00 UTC (10:00 CST)
    - cron: "0 2 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check-updates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check and apply upstream tool versions
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/tools.py check-updates --apply --markdown > updates.md
          cat updates.md
          if git diff --quiet tools.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push update branch
        if: steps.check.outputs.changed == 'true'
        run: |
          BRANCH="chore/tool-updates"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add tools.json
          git commit -m "chore: bump upstream migration tool versions"
          git push --force origin "$BRANCH"

      - name: Create or update Pull Request
        if: steps.check.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const table = fs.readFileSync('updates.md', 'utf8').trim();
            const branch = 'chore/tool-updates';
            const base = context.payload.repository.default_branch || 'main';
            const title = 'chore: bump upstream migration tool versions';
            const body = [
              '检测到 `tools.json` 中锁定的上游工具有新版本发布，已自动更新版本号供审阅合并：',
              '',
              table,
              '',
              '### 合并前检查清单',
              '- [ ] 查看对应工具的 Release Notes，确认 CLI 参数与会话格式无破坏性变更；',
              '- [ ] 本地检出本分支后运行 `python3 scripts/smoke_test.py` 隔离冒烟验证；',
              '- [ ] 同步更新 `README.md` 与对应 `references/*.md` 中的版本号及限制说明。',
              '',
              `_自动巡检时间：${new Date().toISOString()}_`,
            ].join('\n');

            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head: `${context.repo.owner}:${branch}`,
              base,
            });

            if (prs.length > 0) {
              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prs[0].number,
                title,
                body,
              });
            } else {
              await github.rest.pulls.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                head: branch,
                base,
                body,
              });
            }
